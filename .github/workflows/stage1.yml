name: Stage 1
on:
  push:
    branches: [codex/stage1-jsonl]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen schema and Python tests
        run: python -m unittest discover -s handoff/tests -v
