name: REAL-HANDOFF-06 isolated verification
on:
  push:
    branches: [codex/real-handoff-06-verify]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only completion proposal preflight
        run: python pilot/06-pctdecode/proposals/check_completion.py
