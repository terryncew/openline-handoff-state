name: REAL-HANDOFF-08 setup
on:
  pull_request:
    paths:
      - 'pilot/08-intervals/**'
      - '.github/workflows/real-handoff-08.yml'
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit A then perform partial progress in a private fixture
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python pilot/08-intervals/setup/build_a.py
