name: REAL-HANDOFF-08 frozen preflight
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'pilot/08-intervals/**'
      - '.github/workflows/real-handoff-08.yml'
permissions:
  contents: read
jobs:
  frozen-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify frozen accepted chain, newer unadmitted B, and behavior evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python pilot/08-intervals/verify_freeze.py
