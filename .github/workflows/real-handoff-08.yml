name: REAL-HANDOFF-08 setup
on:
  pull_request:
    paths:
      - 'pilot/08-intervals/**'
      - '.github/workflows/real-handoff-08.yml'
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evaluate newer B without owner admission against preserved A
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PROPOSAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROPOSAL_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python pilot/08-intervals/setup/build_b.py
