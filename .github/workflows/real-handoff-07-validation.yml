name: REAL-HANDOFF-07 final proposal preflight
on:
  push:
    branches: [codex/real-handoff-07-validation]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3290014663094c5b0218e99c092d766d9d7b8ebf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact unadmitted proposal preflight
        run: python -B pilot/07-stats/evidence/successor-preflight.py
