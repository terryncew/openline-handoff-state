name: REAL-HANDOFF-07 final proposal preflight
on:
  push:
    branches: [codex/real-handoff-07-validation]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b31818ba97d91deb77f6544c3c33a5ead77d302c
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact unadmitted proposal preflight
        run: python -B pilot/07-stats/evidence/successor-preflight.py
